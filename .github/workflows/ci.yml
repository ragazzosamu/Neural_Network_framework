name: Multi-OS CI

on:
    push:
        branches: ["main", "master"]
    pull_request:
        branches: ["main","master"]
    
jobs:
    test:
        name: Test setup 
        runs-on: ${{matrix.os}}

        strategy:
            fail-fast: false
            matrix:
                os: ["ubuntu","macos-latest","windows-latest"]
        
        steps:
        
        - name: Checkout repo
          uses: actions/checkout@4
        
        - name: Configure CMake
          run: cmake -B build -DCMAKE_BUILD_TYPE=Release

        # 4. Compila il progetto
        - name: Compila il progetto
          run: cmake --build build --config Release

        - name: Test No Windows
          if: runner.os != 'windows'
          run: ./build/Catch2_test

        - name: Test Windows
          if: runner.os == 'windows'
          run: ./build/Release/Catch2_test

